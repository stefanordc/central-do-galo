name: Atualizar Radar do X

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/atualizar-x.yml"
      - "backend/app/services/x_remote_scrape_service.py"
      - "backend/app/services/x_collector_store.py"
      - "backend/scripts/sincronizar_x.py"

permissions:
  contents: read
  id-token: write

concurrency:
  group: atualizar-radar-x
  cancel-in-progress: true

jobs:
  sincronizar:
    name: X - @${{ matrix.conta }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        conta:
          - Atletico
          - BrenoGalante
          - canalbicagalo
          - canaldofrossard
          - CentralDoCAM
          - claudiorez
          - faelslim
          - GaloCareca21
          - Igortep
          - InfoGalo_
          - lucascbretas
          - LucasTanaka
          - ohenriqueandre
          - pedfaria
          - canalcamisadoze

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: production
      X_SOURCE: scrape
      X_REMOTE_STORE_URL: https://lhrpsquyzehevxuogxar.supabase.co/functions/v1/x-collector-store
      X_SCRAPE_HEADLESS: "true"
      X_SCRAPE_PAGE_TIMEOUT_SECONDS: "45"
      X_SCRAPE_TIMELINE_WAIT_SECONDS: "18"
      X_SCRAPE_SCROLL_PAUSE_SECONDS: "2.0"
      X_SCRAPE_MAX_SCROLLS: "6"
      X_SCRAPE_POSTS_PER_ACCOUNT: "3"
      X_SCRAPE_DEBUG_ENABLED: "false"

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar Chrome
        run: |
          google-chrome --version || chromium --version || true

      - name: Sincronizar perfil
        run: python scripts/sincronizar_x.py --conta "${{ matrix.conta }}"
