name: Diagnosticar frontend temporario

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnosticar-frontend-temp.yml"
      - "frontend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar frontend
        run: npm run build
