name: Atualizar noticias

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/atualizar-noticias.yml"
      - "backend/app/services/news_collector_store.py"
      - "backend/scripts/coletar_noticias.py"
      - "backend/app/collectors/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: atualizar-noticias-galo
  cancel-in-progress: false

jobs:
  coletar:
    name: Coletar noticias recentes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend

    env:
      NEWS_REMOTE_STORE_URL: https://lhrpsquyzehevxuogxar.supabase.co/functions/v1/news-collector-store

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-news.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-news.txt

      - name: Coletar noticias
        run: python scripts/coletar_noticias.py --delay 0.2
