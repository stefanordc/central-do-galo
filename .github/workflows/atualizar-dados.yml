name: Atualizar dados do Galo

on:
  schedule:
    # GitHub Actions usa UTC.
    # 06:00 UTC = 03:00 no horário de São Paulo (UTC-3).
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: atualizar-dados-galo
  cancel-in-progress: false

jobs:
  atualizar-dados:
    name: Sincronizar estatísticas do SofaScore
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: backend

    env:
      TZ: America/Sao_Paulo
      APP_ENV: production
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_SSLMODE: ${{ secrets.DB_SSLMODE }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Atualizar estatísticas da temporada atual
        run: python scripts/sincronizar_estatisticas_sofascore.py
