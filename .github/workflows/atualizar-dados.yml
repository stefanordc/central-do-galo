name: Atualizar dados do Galo

on:
  schedule:
    # GitHub Actions usa UTC. 03:00 UTC = 00:00 em Brasília.
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/atualizar-dados.yml"
      - "backend/scripts/sincronizar_estatisticas_remoto.py"
      - "backend/app/services/jogo_service.py"
      - "backend/app/services/dados_service.py"

permissions:
  contents: read
  id-token: write

concurrency:
  group: atualizar-dados-galo-v2
  cancel-in-progress: false

jobs:
  sincronizar:
    name: Estatísticas coletivas e individuais
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: production
      DADOS_REMOTE_STORE_URL: https://lhrpsquyzehevxuogxar.supabase.co/functions/v1/dados-collector-store

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar Chrome
        run: |
          google-chrome --version || chromium --version || true

      - name: Sincronizar estatísticas pendentes
        run: python scripts/sincronizar_estatisticas_remoto.py
