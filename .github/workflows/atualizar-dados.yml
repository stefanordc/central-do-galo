name: Atualizar dados do Galo

on:
  schedule:
    # GitHub Actions usa UTC.
    # 03:00 UTC = 00:00 no horário de Brasília.
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/atualizar-dados.yml"
      - "backend/app/services/data_collector_store.py"
      - "backend/scripts/sincronizar_estatisticas_sofascore_remote.py"
      - "backend/app/services/jogo_service.py"

permissions:
  contents: read
  id-token: write

concurrency:
  group: atualizar-dados-galo
  cancel-in-progress: false

jobs:
  atualizar-dados:
    name: Sincronizar estatísticas coletivas e individuais
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: backend

    env:
      TZ: America/Sao_Paulo
      APP_ENV: production
      DATA_REMOTE_STORE_URL: https://lhrpsquyzehevxuogxar.supabase.co/functions/v1/data-collector-store

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar Chrome
        run: |
          google-chrome --version || chromium --version || true

      - name: Sincronizar estatísticas
        run: python scripts/sincronizar_estatisticas_sofascore_remote.py --ano 2026 --recent-days 4 --full
