name: Diagnosticar fallback X

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnosticar-x-syndication.yml"

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Inspecionar primeiro item RSS
        run: |
          curl -L -A "Mozilla/5.0" --max-time 20 -sS             "https://x.n0g.xyz/Atletico/rss"             | awk '/<item>/{flag=1} flag{print} /<\/item>/{exit}'
