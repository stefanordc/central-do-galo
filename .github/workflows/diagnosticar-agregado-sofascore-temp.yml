name: Diagnosticar estatisticas agregadas

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnosticar-agregado-sofascore-temp.yml"

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Testar endpoint agregado
        run: |
          python - <<'PY'
          import json
          from app.services.jogo_service import _cliente_sofascore, fechar_cliente_sofascore

          fields = [
              "goals","yellowCards","redCards","groundDuelsWon","aerialDuelsWon",
              "successfulDribbles","tackles","assists","accuratePasses","keyPasses",
              "accurateCrosses","accurateLongBalls","interceptions","clearances",
              "dribbledPast","bigChancesMissed","totalShots","shotsOnTarget",
              "blockedShots","hitWoodwork","offsides","expectedGoals",
              "minutesPlayed","appearances","started","saves","rating"
          ]

          url = (
              "https://www.sofascore.com/api/v1/unique-tournament/325/season/87678/statistics"
              "?limit=100&order=-rating&offset=0&accumulation=total"
              "&fields=" + "%2C".join(fields)
              + "&filters=position.in.G~D~M~F"
          )

          try:
              data = _cliente_sofascore().get_json(url)
              print("TOP_KEYS", list(data.keys()))
              print("ERROR", data.get("error"))
              rows = data.get("results") or []
              print("RESULTS", len(rows))
              galo = [x for x in rows if (x.get("team") or {}).get("id") == 1977]
              print("GALO", len(galo))
              for row in galo[:5]:
                  print(json.dumps(row, ensure_ascii=False)[:3000])
          finally:
              fechar_cliente_sofascore()
          PY
