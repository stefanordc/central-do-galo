name: Diagnosticar secrets dados

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnosticar-secrets-dados.yml"

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar configuracao sem expor valores
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          python - <<'PY'
import os
for nome in ["API_FOOTBALL_KEY","DB_HOST","DB_USER","DB_PASSWORD"]:
    print(f"{nome}={'configurado' if os.getenv(nome) else 'ausente'}")
PY
