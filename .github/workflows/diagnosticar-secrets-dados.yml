name: Diagnosticar secrets dados

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnosticar-secrets-dados.yml"

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar configuracao sem expor valores
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          [ -n "$API_FOOTBALL_KEY" ] && echo "API_FOOTBALL_KEY=configurado" || echo "API_FOOTBALL_KEY=ausente"
          [ -n "$DB_HOST" ] && echo "DB_HOST=configurado" || echo "DB_HOST=ausente"
          [ -n "$DB_USER" ] && echo "DB_USER=configurado" || echo "DB_USER=ausente"
          [ -n "$DB_PASSWORD" ] && echo "DB_PASSWORD=configurado" || echo "DB_PASSWORD=ausente"
