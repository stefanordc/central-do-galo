name: Validar analytics e cron temporariamente

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/validar-analytics-cron-temp.yml"
      - "frontend/src/app/cron/dados/route.ts"
      - "frontend/src/app/admin/page.tsx"
      - "frontend/src/components/AccessTracker.tsx"
      - "frontend/src/components/CentralDoGaloPage.tsx"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
