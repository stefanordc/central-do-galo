name: Reprocessar videos generalistas

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/reprocessar-videos-generalistas.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: reprocessar-videos-generalistas-v1
  cancel-in-progress: true

jobs:
  sincronizar:
    name: Generalista - ${{ matrix.fonte }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        fonte:
          - youtube-getv
          - youtube-cazetv
          - youtube-espnbrasil

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: production
      YOUTUBE_REMOTE_STORE_URL: https://lhrpsquyzehevxuogxar.supabase.co/functions/v1/video-collector-store
      YOUTUBE_ITEMS_PER_SECTION: "13"
      YOUTUBE_SCRAPE_HEADLESS: "true"
      YOUTUBE_SCRAPE_PAGE_TIMEOUT_SECONDS: "45"
      YOUTUBE_SCRAPE_WAIT_SECONDS: "20"
      YOUTUBE_SCRAPE_SCROLL_PAUSE_SECONDS: "1.2"
      YOUTUBE_SCRAPE_MAX_SCROLLS: "35"
      YOUTUBE_SCRAPE_DEBUG_ENABLED: "false"

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sincronizar canal
        run: python scripts/sincronizar_youtube.py --fonte "${{ matrix.fonte }}"
