name: Atualizar calendario de jogos

on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/atualizar-jogos.yml"

concurrency:
  group: atualizar-calendario-jogos
  cancel-in-progress: true

jobs:
  atualizar-jogos:
    name: Sincronizar jogos do SofaScore
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: backend

    env:
      TZ: America/Sao_Paulo
      APP_ENV: production
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_SSLMODE: ${{ secrets.DB_SSLMODE }}

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar Chrome
        run: |
          google-chrome --version || chromium --version || true

      - name: Sincronizar ultimos e proximos jogos
        run: python scripts/sincronizar_jogos_sofascore.py --modo atual
