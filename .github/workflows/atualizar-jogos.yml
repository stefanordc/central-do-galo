name: Atualizar calendario de jogos

on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/atualizar-jogos.yml"
      - "backend/scripts/sincronizar_jogos_remoto.py"
      - "backend/app/services/jogos_collector_store.py"
      - "backend/app/services/jogo_service.py"

permissions:
  contents: read
  id-token: write

concurrency:
  group: atualizar-calendario-jogos-v2
  cancel-in-progress: true

jobs:
  atualizar-jogos:
    name: Sincronizar jogos do SofaScore
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: backend

    env:
      TZ: America/Sao_Paulo
      APP_ENV: production
      JOGOS_REMOTE_STORE_URL: https://lhrpsquyzehevxuogxar.supabase.co/functions/v1/jogos-collector-store

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar Chrome
        run: |
          google-chrome --version || chromium --version || true

      - name: Sincronizar ultimos e proximos jogos
        run: python scripts/sincronizar_jogos_remoto.py
